version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: truecaller-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trueguard
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=1h
      - JWT_REFRESH_EXPIRATION=7d
    depends_on:
      - postgres
      - redis
    networks:
      - truecaller-network

  postgres:
    image: postgres:16-alpine
    container_name: truecaller-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trueguard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - truecaller-network

  redis:
    image: redis:7-alpine
    container_name: truecaller-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - truecaller-network

  # Optional: Adminer for database management
  adminer:
    image: adminer:latest
    container_name: truecaller-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - truecaller-network

volumes:
  postgres-data:
  redis-data:

networks:
  truecaller-network:
    driver: bridge
